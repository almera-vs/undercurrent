name: daily

# Nightly run. Cron is UTC: 17:47 UTC = 18:47 CET (winter) / 19:47 CEST (summer).
# :47 avoids the top-of-hour scheduling backlog. The NewConnect price file is polled
# until 20:05 Warsaw time (DST-aware, computed in Python), see docs/DECISIONS.md.
on:
  schedule:
    - cron: "47 17 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "trading day YYYY-MM-DD, or 'today' (Warsaw)"
        default: "today"
      wait_nc:
        description: "poll for the NewConnect price file"
        type: boolean
        default: true
      send:
        description: "send the Telegram digest"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DATE: ${{ inputs.date || 'today' }}
    steps:
      - name: resolve date
        # GitHub can deliver a schedule hours late. A run that starts before the 17:05 close
        # belongs to the last weekday whose session has finished, not to the new day.
        run: |
          if [ "$DATE" = "today" ]; then
            d=$(TZ=Europe/Warsaw date +%F)
            if [ "$(TZ=Europe/Warsaw date +%H%M)" -lt 1705 ]; then d=$(date -d "$d -1 day" +%F); fi
            while [ "$(date -d "$d" +%u)" -ge 6 ]; do d=$(date -d "$d -1 day" +%F); done
            echo "DATE=$d" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --no-dev --group dbt
      - uses: actions/cache/restore@v4
        with:
          path: .cache/http
          key: http-${{ github.run_id }}
          restore-keys: http-
      - name: undercurrent run
        env:
          WAIT_NC: ${{ github.event_name == 'schedule' || inputs.wait_nc }}
          SEND: ${{ github.event_name == 'schedule' || inputs.send }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          flags=""
          if [ "$WAIT_NC" != "true" ]; then flags="$flags --no-wait-nc"; fi
          if [ "$SEND" != "true" ]; then
            unset TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID
          fi
          uv run undercurrent --data-dir data run --date "$DATE" $flags
      - name: lake size check
        run: uv run undercurrent --data-dir data check-lake --max-mb 900
      - name: commit data
        if: always()
        run: scripts/commit_data.sh "daily ${DATE} (run ${{ github.run_id }})"
      - name: commit digest archive to main (keeps scheduled workflows alive)
        if: success()
        run: |
          git config user.name "almera-vs"
          git config user.email "60035016+almera-vs@users.noreply.github.com"
          git add digests
          if git diff --cached --quiet; then echo "no digest changes"; exit 0; fi
          git commit -q -m "digest ${DATE}"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: _site
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/http
          key: http-${{ github.run_id }}
      - name: alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          uv run undercurrent --data-dir data alert \
            "Nightly run for ${DATE} failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true

  deploy:
    needs: run
    runs-on: ubuntu-latest
    # GitHub Pages must be enabled (Settings → Pages → Source: GitHub Actions). Free only
    # for public repos; until then this job fails without affecting the digest.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
