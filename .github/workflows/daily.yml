name: daily

# Nightly run. The digest covers reports published up to 18:30 Warsaw time and should go
# out soon after. GitHub delivers this repository's schedules 5-7 hours late (measured), so
# one cron at the right time arrives near midnight. Instead an attempt is requested every
# 30 minutes through the day and the gate job (scripts/nightly_gate.sh) lets one through:
# the first that starts after the cut-off, or any that finds the previous trading day's
# digest still missing. The others end in seconds. A failed run leaves no digest, so the
# next attempt retries it.
on:
  schedule:
    - cron: "17,47 9-21 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "trading day YYYY-MM-DD, or 'today' (Warsaw)"
        default: "today"
      wait_nc:
        description: "poll for the NewConnect price file (until 20:05 Warsaw time)"
        type: boolean
        default: false
      send:
        description: "send the Telegram digest"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
      date: ${{ steps.gate.outputs.date }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.date || 'today' }}
        run: scripts/nightly_gate.sh "${{ github.event_name }}" "$REQUESTED" | tee -a "$GITHUB_OUTPUT"

  run:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DATE: ${{ needs.gate.outputs.date }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --no-dev --group dbt
      - uses: actions/cache/restore@v6
        with:
          path: .cache/http
          key: http-${{ github.run_id }}
          restore-keys: http-
      - name: undercurrent run
        env:
          # Scheduled runs do not wait for the NewConnect file (it can appear as late as
          # 19:50 Warsaw time): the digest goes out first, the next run fills the day in.
          WAIT_NC: ${{ inputs.wait_nc == true }}
          SEND: ${{ github.event_name == 'schedule' || inputs.send }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          flags=""
          if [ "$WAIT_NC" != "true" ]; then flags="$flags --no-wait-nc"; fi
          if [ "$SEND" != "true" ]; then
            unset TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID
          fi
          uv run undercurrent --data-dir data run --date "$DATE" $flags
      - name: lake size check
        run: uv run undercurrent --data-dir data check-lake --max-mb 900
      - name: commit data
        if: always()
        run: scripts/commit_data.sh "daily ${DATE} (run ${{ github.run_id }})"
      - name: commit digest archive to main (keeps scheduled workflows alive)
        if: success()
        run: |
          git config user.name "almera-vs"
          git config user.email "60035016+almera-vs@users.noreply.github.com"
          git add digests
          if git diff --cached --quiet; then echo "no digest changes"; exit 0; fi
          git commit -q -m "digest ${DATE}"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - uses: actions/upload-pages-artifact@v5
        if: success()
        with:
          path: _site
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .cache/http
          key: http-${{ github.run_id }}
      - name: alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          uv run undercurrent --data-dir data alert \
            "Nightly run for ${DATE} failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true

  deploy:
    needs: run
    runs-on: ubuntu-latest
    # GitHub Pages must be enabled (Settings → Pages → Source: GitHub Actions). Free only
    # for public repos; until then this job fails without affecting the digest.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
