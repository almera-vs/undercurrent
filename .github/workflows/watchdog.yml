name: watchdog

# Freshness SLO guard: send a Telegram alert if the latest nightly run that should have
# finished (by 20:15 Warsaw time on a weekday) has not succeeded. Which run that is, is
# worked out from the clock in Python, so a check that GitHub delivers late still checks
# the right day. Two crons cover both CET and CEST.
on:
  schedule:
    - cron: "20 18 * * 1-5"  # 20:20 CEST (summer)
    - cron: "20 19 * * 1-5"  # 20:20 CET (winter)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked --no-dev
      - name: alert if stale
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run undercurrent --data-dir data alert --if-stale
