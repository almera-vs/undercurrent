name: backfill

# Historical backfill, one calendar month per job. Jobs run strictly one at a time
# (max-parallel: 1) so total request rate to gpw.pl / newconnect.pl stays <= 1/s, and the
# Python code pauses during the nightly window. Every step is idempotent: re-running a
# month only fetches what is missing.
#
# With `gaps`, the plan is not every month of the range but the sessions the price lake
# lacks (`undercurrent lake-gaps`): a month that failed, or stopped because the source was
# down, is found and re-run without re-listing the months that are complete.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "first day YYYY-MM-DD"
        required: true
        default: "2015-01-01"
      end:
        description: "last day YYYY-MM-DD"
        required: true
      gaps:
        description: "only the sessions the price lake lacks in the range"
        type: boolean
        default: false

permissions:
  contents: write

# Two backfills at once would double the request rate: a second run waits for the first.
concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      months: ${{ steps.gaps.outputs.months || steps.months.outputs.months }}
    steps:
      - if: inputs.gaps
        uses: actions/checkout@v7
      - if: inputs.gaps
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 1
      - if: inputs.gaps
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - if: inputs.gaps
        run: uv python install 3.12 && uv sync --locked --no-dev
      - id: gaps
        if: inputs.gaps
        run: |
          ranges=$(uv run undercurrent --data-dir data lake-gaps --start "${{ inputs.start }}" --end "${{ inputs.end }}")
          python3 -c "import json,sys; r=json.loads(sys.argv[1]); assert len(r) <= 256, 'split the range: max 256 jobs'; print('months=' + json.dumps(r))" "$ranges" >> "$GITHUB_OUTPUT"
      - id: months
        if: ${{ !inputs.gaps }}
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import date, timedelta
          s, e = date.fromisoformat(os.environ["START"]), date.fromisoformat(os.environ["END"])
          out, d = [], s
          while d <= e:
              nxt = (d.replace(day=1) + timedelta(days=32)).replace(day=1)
              out.append({"start": d.isoformat(), "end": min(e, nxt - timedelta(days=1)).isoformat()})
              d = nxt
          assert len(out) <= 256, "split the range: max 256 months per workflow run"
          print("months=" + json.dumps(out))
          PY

  month:
    needs: plan
    if: needs.plan.outputs.months != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        month: ${{ fromJson(needs.plan.outputs.months) }}
    name: ${{ matrix.month.start }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --no-dev
      - name: backfill
        run: uv run undercurrent --data-dir data backfill --start "${{ matrix.month.start }}" --end "${{ matrix.month.end }}"
      - name: lake size check
        run: uv run undercurrent --data-dir data check-lake --max-mb 900
      - name: commit data
        if: always()
        run: scripts/commit_data.sh "backfill ${{ matrix.month.start }}..${{ matrix.month.end }}"
