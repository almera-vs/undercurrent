[project]
name = "undercurrent"
version = "0.1.0"
description = "Nightly radar for GPW + NewConnect ESPI/EBI reports, with honest event studies."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28",
    "selectolax>=0.3.27",
    "lxml>=5.3",
    "pdfplumber>=0.11",
    "rapidfuzz>=3.10",
    "polars>=1.20",
    "pyarrow>=18",
    "duckdb>=1.1",
    "numpy>=2.1",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "jinja2>=3.1",
    "xlrd>=2.0.1",
    "openpyxl>=3.1",
]

[project.scripts]
undercurrent = "undercurrent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
]
dbt = [
    "dbt-duckdb>=1.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/undercurrent"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = ["D203", "D213", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["undercurrent"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "xlrd.*", "openpyxl.*", "statsmodels.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: test hits the real network (skipped unless UNDERCURRENT_NETWORK=1)",
]
